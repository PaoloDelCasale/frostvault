name: Agent pipeline auto-merge

# Squash-merge agent pull requests whose checks have all passed.
#
# GitHub's schedule trigger is unreliable (often delayed by hours), so this also
# runs when a check_suite completes on a cursor/* branch — that is when a PR
# actually becomes mergeable. schedule remains as a backup; workflow_dispatch
# remains for recovery.
#
# workflow_run and pull_request_target stay forbidden (tests/test_ci_contracts.py):
# both hand a privileged token to a workflow chosen by pull-request activity.
# check_suite runs the workflow from the default branch, same as schedule.
#
# After each merge, the script unblocks dependents and dispatches agents itself:
# merges with GITHUB_TOKEN close linked issues without re-firing issues:closed
# workflows, so agent-unblock.yml alone would stall the chain.
#
# The gates live in .github/scripts/agent_pipeline.py and are covered by
# tests/test_agent_pipeline.py. In short: same-repo cursor/* branch, not a draft,
# closes an agent-pipeline issue, mergeable, and every check run green. The same
# job also re-dispatches repair agents when checks failed after the Cursor run
# went idle (idle ≠ done).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    name: Merge finished agent work
    # Ignore check suites on non-agent branches so human PRs do not wake the sweep.
    if: >-
      github.event_name != 'check_suite' ||
      startsWith(github.event.check_suite.head_branch, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Merge pull requests that are fully green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_EPIC_56_WEBHOOK_URL: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_URL }}
          CURSOR_EPIC_56_WEBHOOK_KEY: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_KEY }}
        run: python .github/scripts/agent_pipeline.py "${{ github.repository }}" merge
