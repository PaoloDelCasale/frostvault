name: Agent pipeline dispatch

# Start a cloud agent on one pipeline issue.
#
# Triggers:
# - workflow_dispatch: kick off the first issue of a chain, or restart one whose
#   agent died.
# - issues labeled ready-for-agent: covers the case where a human (or a process
#   that is not GITHUB_TOKEN) adds the label without going through unblock.
#
# Refuses any issue that does not carry agent-pipeline. Idempotent via
# agent-dispatched.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to hand to an agent
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    name: Dispatch one issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start a cloud agent on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_EPIC_56_WEBHOOK_URL: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_URL }}
          CURSOR_EPIC_56_WEBHOOK_KEY: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_KEY }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue || github.event.issue.number }}
        run: |
          python .github/scripts/agent_pipeline.py \
            "${{ github.repository }}" dispatch "${ISSUE_NUMBER}"
