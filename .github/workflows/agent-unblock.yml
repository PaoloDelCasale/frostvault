name: Agent pipeline unblock

# When an issue closes, label the issues it was blocking that nothing blocks any
# more, and start a cloud agent on each of them.
# See AGENTS.md ("Automated agent pipeline").

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  unblock:
    name: Start the next unblocked issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Label and dispatch the dependents whose blockers are all closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_EPIC_56_WEBHOOK_URL: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_URL }}
          CURSOR_EPIC_56_WEBHOOK_KEY: ${{ secrets.CURSOR_EPIC_56_WEBHOOK_KEY }}
        run: |
          python .github/scripts/agent_pipeline.py \
            "${{ github.repository }}" unblock "${{ github.event.issue.number }}"
