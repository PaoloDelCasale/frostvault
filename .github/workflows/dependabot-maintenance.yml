name: Dependabot maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Catch newly opened PRs without using a privileged pull-request trigger.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Enable auto-merge and update stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Maintain open Dependabot pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # mergeStateStatus lags for tens of seconds after a merge to main,
          # so a push-triggered run would skip every update-branch. Always
          # attempt the refresh; already-current PRs return 422.
          if [[ "$EVENT_NAME" == "push" ]]; then
            sleep 15
          fi

          prs="$({
            gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --author app/dependabot \
              --limit 100 \
              --json number,url,isDraft,headRefOid
          })"

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<<"$pr")"
            url="$(jq -r '.url' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            head_sha="$(jq -r '.headRefOid' <<<"$pr")"

            if [[ "$draft" == "false" ]]; then
              echo "Refreshing Dependabot PR #$number against the current base branch"
              if ! gh api \
                --method PUT \
                "repos/$GH_REPO/pulls/$number/update-branch" \
                -f "expected_head_sha=$head_sha"
              then
                echo "::warning::Could not update Dependabot PR #$number; it may already be current or conflicting"
              fi
            fi

            commit_messages="$({
              gh api --paginate \
                "repos/$GH_REPO/pulls/$number/commits?per_page=100" \
                --jq '.[].commit.message'
            })"
            # Patch/minor version updates, plus security advisories that omit
            # update-type, queue for squash auto-merge. Majors stay manual.
            if [[ "$draft" == "false" ]] && \
              ! grep -Fq 'update-type: version-update:semver-major' \
                <<<"$commit_messages" && \
              {
                grep -Eq 'update-type: version-update:semver-(minor|patch)' \
                  <<<"$commit_messages" || \
                ! grep -Fq 'update-type: version-update:' \
                  <<<"$commit_messages"
              }
            then
              echo "Enabling auto-merge for Dependabot PR #$number"
              if ! gh pr merge --repo "$GH_REPO" --auto --squash "$url"; then
                echo "::warning::Could not enable auto-merge for Dependabot PR #$number"
              fi
            fi
          done < <(jq -c '.[]' <<<"$prs")
