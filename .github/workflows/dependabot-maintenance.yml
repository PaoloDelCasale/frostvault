name: Dependabot maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Catch newly opened PRs without using a privileged pull-request trigger.
    # GitHub may delay high-frequency crons; this is a backstop, not the
    # primary keep-up-to-date path (see the drain loop below).
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Enable auto-merge and update stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maintain open Dependabot pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # mergeStateStatus lags for tens of seconds after a merge to main,
          # so a push-triggered run would skip every update-branch. Always
          # attempt the refresh; already-current PRs return 422.
          if [[ "$EVENT_NAME" == "push" ]]; then
            sleep 15
          fi

          list_prs() {
            gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --author app/dependabot \
              --limit 100 \
              --json number,url,isDraft,headRefOid
          }

          pr_commit_messages() {
            local number="$1"
            gh api --paginate \
              "repos/$GH_REPO/pulls/$number/commits?per_page=100" \
              --jq '.[].commit.message'
          }

          is_automerge_candidate() {
            local draft="$1"
            local commit_messages="$2"
            [[ "$draft" == "false" ]] || return 1
            # Patch/minor version updates, plus security advisories that omit
            # update-type, queue for squash auto-merge. Majors stay manual.
            ! grep -Fq 'update-type: version-update:semver-major' \
              <<<"$commit_messages" && \
            {
              grep -Eq 'update-type: version-update:semver-(minor|patch)' \
                <<<"$commit_messages" || \
              ! grep -Fq 'update-type: version-update:' \
                <<<"$commit_messages"
            }
          }

          refresh_pr() {
            local number="$1"
            local head_sha="$2"
            echo "Refreshing Dependabot PR #$number against the current base branch"
            if ! gh api \
              --method PUT \
              "repos/$GH_REPO/pulls/$number/update-branch" \
              -f "expected_head_sha=$head_sha"
            then
              echo "::warning::Could not update Dependabot PR #$number; it may already be current or conflicting"
            fi
          }

          refresh_all() {
            local prs
            prs="$(list_prs)"
            while IFS= read -r pr; do
              [[ -n "$pr" ]] || continue
              local number draft head_sha
              number="$(jq -r '.number' <<<"$pr")"
              draft="$(jq -r '.isDraft' <<<"$pr")"
              head_sha="$(jq -r '.headRefOid' <<<"$pr")"
              if [[ "$draft" == "false" ]]; then
                refresh_pr "$number" "$head_sha"
              fi
            done < <(jq -c '.[]' <<<"$prs")
          }

          refresh_all

          prs="$(list_prs)"
          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            number="$(jq -r '.number' <<<"$pr")"
            url="$(jq -r '.url' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            commit_messages="$(pr_commit_messages "$number")"

            if is_automerge_candidate "$draft" "$commit_messages"; then
              echo "Enabling auto-merge for Dependabot PR #$number"
              if ! gh pr merge --repo "$GH_REPO" --auto --squash "$url"; then
                echo "::warning::Could not enable auto-merge for Dependabot PR #$number"
              fi
            fi
          done < <(jq -c '.[]' <<<"$prs")

          # GitHub auto-merge performed by GITHUB_TOKEN does not retrigger
          # this workflow, so a queued --auto merge would leave every other
          # Dependabot PR "out of date" until a delayed schedule run.
          # Drain CLEAN minors here, then refresh remaining heads.
          merged=1
          while [[ "$merged" == "1" ]]; do
            merged=0
            prs="$(list_prs)"
            while IFS= read -r pr; do
              [[ -n "$pr" ]] || continue
              number="$(jq -r '.number' <<<"$pr")"
              url="$(jq -r '.url' <<<"$pr")"
              draft="$(jq -r '.isDraft' <<<"$pr")"
              commit_messages="$(pr_commit_messages "$number")"
              is_automerge_candidate "$draft" "$commit_messages" || continue
              state="$(
                gh pr view --repo "$GH_REPO" "$number" \
                  --json mergeStateStatus --jq '.mergeStateStatus'
              )"
              if [[ "$state" == "CLEAN" ]]; then
                echo "Merging Dependabot PR #$number (mergeStateStatus=CLEAN)"
                if gh pr merge --repo "$GH_REPO" --squash "$url"; then
                  merged=1
                  sleep 15
                  refresh_all
                  break
                fi
              fi
            done < <(jq -c '.[]' <<<"$prs")
          done
