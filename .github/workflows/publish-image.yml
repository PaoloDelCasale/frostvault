name: Publish container image

# Uses only actions/checkout (GitHub-owned). The repository Actions allowlist
# blocks docker/* marketplace actions, so tagging/login/push use the Docker CLI
# already available on ubuntu-latest (same approach as the Trivy image build).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          IMAGE: ghcr.io/paolodelcasale/frostvault
          REF_NAME: ${{ github.ref_name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_tag="sha-${SHA_SHORT:0:7}"
          tags=("${IMAGE}:${sha_tag}")

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags+=("${IMAGE}:latest")
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            tags+=("${IMAGE}:${version}")
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
              tags+=("${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            fi
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done

          docker build "${tag_args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
