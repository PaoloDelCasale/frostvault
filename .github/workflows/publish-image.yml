name: Publish container image

# Uses only actions/checkout (GitHub-owned). The repository Actions allowlist
# blocks docker/* marketplace actions, so tagging/login/push use the Docker CLI
# already available on ubuntu-latest (same approach as the Trivy image build).

on:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: Existing semantic-version image tag to promote to latest without rebuilding
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote an existing release image to latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_tag != '' }}
        env:
          IMAGE: ghcr.io/paolodelcasale/frostvault
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$PROMOTE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote_tag must be a semantic version such as 0.3.0" >&2
            exit 64
          fi

          docker pull "${IMAGE}:${PROMOTE_TAG}"
          source_digest="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "${IMAGE}:${PROMOTE_TAG}")"
          source_digest="${source_digest#*@}"
          docker tag "${IMAGE}:${PROMOTE_TAG}" "${IMAGE}:latest"
          push_output="$(docker push "${IMAGE}:latest")"
          printf '%s\n' "$push_output"
          pushed_digest="$(printf '%s\n' "$push_output" | awk '/digest:/ {print $3}' | tail -1)"
          if [ -z "$pushed_digest" ] || [ "$pushed_digest" != "$source_digest" ]; then
            echo "latest digest $pushed_digest does not match ${PROMOTE_TAG} digest $source_digest" >&2
            exit 1
          fi

      - name: Build and push image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_tag == '' }}
        env:
          IMAGE: ghcr.io/paolodelcasale/frostvault
          REF_NAME: ${{ github.ref_name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_tag="sha-${SHA_SHORT:0:7}"
          tags=("${IMAGE}:${sha_tag}")

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            tags+=("${IMAGE}:${version}" "${IMAGE}:latest")
            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
              tags+=("${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            fi
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done

          docker build "${tag_args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
