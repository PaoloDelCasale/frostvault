# Reference Traefik deployment. FrostVault stays on a private Docker
# network and is never published with host ports — Traefik terminates TLS.
#
# Prerequisites: a Traefik instance with an entrypoint `websecure`, a
# certificate resolver `letsencrypt`, and the external network `proxy`.
# Set TRUSTED_PROXIES (app) and FORWARDED_ALLOW_IPS (Uvicorn) explicitly to
# the same narrow proxy IPs/CIDRs as seen by FrostVault, and ALLOWED_HOSTS
# to the public hostname. Neither proxy allowlist is derived from the other.

networks:
  proxy:
    external: true
  frostvault_internal:
    driver: bridge
    internal: true

services:
  frostvault:
    image: ghcr.io/paolodelcasale/frostvault:latest
    container_name: frostvault
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      COOKIE_SECURE: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-frostvault.example.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set TRUSTED_PROXIES to the actual proxy IPs/CIDRs}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to the same proxy IPs/CIDRs}
    # cap_drop: ALL deliberately removes the privileges needed to switch IDs.
    # Start as the configured identity; the image includes the 99:100 default.
    user: "${PUID:-99}:${PGID:-100}"
    volumes:
      # Before first up, create ./data on the host as PUID:PGID with mode 0750.
      # The entrypoint never chowns vault sources or creates runtime accounts.
      - "${SOURCES_ROOT}:/sources:rw"
      - "./data:/data:rw"
    # Create writable ephemeral directories with the runtime identity because
    # cap_drop: ALL prevents the entrypoint from chowning them at startup.
    tmpfs:
      - "/tmp:uid=${PUID:-99},gid=${PGID:-100},mode=1777"
      - "/run:uid=${PUID:-99},gid=${PGID:-100},mode=0755"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frostvault_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frostvault.rule=Host(`${ALLOWED_HOSTS:-frostvault.example.com}`)"
      - "traefik.http.routers.frostvault.entrypoints=websecure"
      - "traefik.http.routers.frostvault.tls=true"
      - "traefik.http.routers.frostvault.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frostvault.middlewares=frostvault-headers,frostvault-ratelimit"
      - "traefik.http.services.frostvault.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.frostvault-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.frostvault-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.frostvault-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.frostvault-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.frostvault-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.frostvault-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.frostvault-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.frostvault-headers.headers.customFrameOptionsValue=DENY"
      - "traefik.http.middlewares.frostvault-headers.headers.contentSecurityPolicy=default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'"
      - "traefik.http.middlewares.frostvault-ratelimit.rateLimit.average=100"
      - "traefik.http.middlewares.frostvault-ratelimit.rateLimit.burst=200"
