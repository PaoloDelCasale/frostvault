services:
  frostvault:
    build: .
    container_name: frostvault
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # Host directories must be writable by PUID:PGID. The entrypoint never
      # chowns vault sources; permission the host paths explicitly.
      - "${SOURCES_ROOT}:/sources:rw"
      - "./data:/data"
      - "./config:/config/rclone:ro"
    tmpfs:
      - /tmp
      - /run
    read_only: true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
